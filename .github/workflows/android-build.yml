name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      project:
        description: Project folder to build
        required: false
        default: android-app
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x ${{ github.event.inputs.project || 'android-app' }}/gradlew || true
      - name: Build debug APK
        working-directory: ${{ github.event.inputs.project || 'android-app' }}
        run: gradle wrapper --no-daemon || true && gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ github.event.inputs.project || 'android-app' }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
